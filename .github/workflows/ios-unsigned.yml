name: Build unsigned iOS IPA

# 目的：在没有 Mac 的情况下，用 GitHub 的 macOS runner 编出未签名 ipa，
# 再用 Sideloadly / AltStore 在 Windows 上侧载到 iPhone / iPad。
#
# 用法：推到 GitHub 仓库后，在 Actions 页面手动 Run workflow，
# 跑完在 Artifacts 里下载 xgiwifi-unsigned-ipa。
#
# 失败时会把完整日志推到 ci-logs 分支，方便在没有图形界面时排查。

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'lib/**'
      - 'ios/**'
      - 'pubspec.yaml'
      - '.github/workflows/ios-unsigned.yml'

permissions:
  contents: write

jobs:
  build-ipa:
    runs-on: macos-15
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Show toolchain
        run: |
          set -o pipefail
          flutter --version 2>&1 | tee /tmp/00-toolchain.log
          xcodebuild -version 2>&1 | tee -a /tmp/00-toolchain.log
          pod --version 2>&1 | tee -a /tmp/00-toolchain.log
          sw_vers 2>&1 | tee -a /tmp/00-toolchain.log

      - name: Resolve dependencies
        run: |
          set -o pipefail
          flutter pub get 2>&1 | tee /tmp/01-pubget.log

      - name: Install CocoaPods
        working-directory: ios
        run: |
          set -o pipefail
          pod install 2>&1 | tee /tmp/02-pod.log | tail -40

      - name: Build (no codesign)
        run: |
          set -o pipefail
          flutter build ios --release --no-codesign 2>&1 | tee /tmp/03-build.log | tail -60

      - name: Package Payload
        run: |
          set -euo pipefail
          APP_PATH="build/ios/iphoneos/Runner.app"
          test -d "$APP_PATH" || { echo "Runner.app 不存在，构建失败"; exit 1; }
          rm -rf Payload xGiWifi-unsigned.ipa
          mkdir -p Payload
          cp -R "$APP_PATH" Payload/
          zip -qry xGiWifi-unsigned.ipa Payload
          ls -lh xGiWifi-unsigned.ipa
          echo "### 产物大小" >> "$GITHUB_STEP_SUMMARY"
          du -h xGiWifi-unsigned.ipa >> "$GITHUB_STEP_SUMMARY"

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: xgiwifi-unsigned-ipa
          path: xGiWifi-unsigned.ipa
          if-no-files-found: error
          retention-days: 14

      # 失败时把日志推到 ci-logs 分支，便于在没有登录会话的情况下读取真实报错
      - name: Publish failure logs
        if: failure()
        run: |
          set -x
          mkdir -p ci-logs
          cp /tmp/*.log ci-logs/ 2>/dev/null || true
          flutter doctor -v > ci-logs/09-doctor.log 2>&1 || true
          echo "run_id=$GITHUB_RUN_ID" > ci-logs/meta.txt
          echo "sha=$GITHUB_SHA" >> ci-logs/meta.txt
          git config user.name "ci-bot"
          git config user.email "ci-bot@users.noreply.github.com"
          git checkout -B ci-logs
          git add -A -f ci-logs
          git commit -m "ci: failure log for run $GITHUB_RUN_ID" || true
          git push -f origin ci-logs
