name: Build unsigned iOS IPA

# 目的：在没有 Mac 的情况下，用 GitHub 的 macOS runner 编出未签名 ipa，
# 再用 Sideloadly / AltStore 在 Windows 上侧载到 iPhone / iPad。
#
# 用法：推到 GitHub 仓库后，在 Actions 页面手动 Run workflow，
# 跑完在 Artifacts 里下载 xgiwifi-unsigned-ipa。
#
# 失败时会把完整日志推到 ci-logs 分支，方便在没有图形界面时排查。

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'lib/**'
      - 'ios/**'
      - 'pubspec.yaml'
      - '.github/workflows/ios-unsigned.yml'

permissions:
  contents: write

jobs:
  build-ipa:
    runs-on: macos-15
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Show toolchain
        run: |
          set -o pipefail
          flutter --version 2>&1 | tee /tmp/00-toolchain.log
          xcodebuild -version 2>&1 | tee -a /tmp/00-toolchain.log
          pod --version 2>&1 | tee -a /tmp/00-toolchain.log
          sw_vers 2>&1 | tee -a /tmp/00-toolchain.log

      - name: Resolve dependencies
        run: |
          set -o pipefail
          flutter pub get 2>&1 | tee /tmp/01-pubget.log

      # Flutter 引擎自带的 Flutter.podspec 会要求一个最低 iOS 版本，
      # 版本号随 Flutter 升级而变（3.47 已高于 13.0）。
      # 这里直接读 podspec 里的真实值，同步到 Podfile / 工程 / plist，
      # 避免以后 Flutter 升版本又因为部署目标报错。
      - name: Align iOS deployment target
        run: |
          set -o pipefail
          {
            set -uo pipefail
            flutter precache --ios
            FR="$(cd "$(dirname "$(command -v flutter)")/.." && pwd)"
            echo "FLUTTER_ROOT=$FR"

            SPEC="$(find "$FR/bin/cache" -name 'Flutter.podspec' -print -quit 2>/dev/null)"
            if [ -z "$SPEC" ]; then
              SPEC="$(find "$FR" -name 'Flutter.podspec' -print -quit 2>/dev/null)"
            fi
            echo "Flutter.podspec=$SPEC"

            MIN=""
            if [ -n "$SPEC" ] && [ -f "$SPEC" ]; then
              echo "--- podspec 头部 ---"
              sed -n '1,60p' "$SPEC"
              echo "--- 提取 platform ---"
              MIN="$(grep -E "platform" "$SPEC" | grep -oE ":ios,[[:space:]]*['\"][0-9.]+['\"]" \
                     | grep -oE "[0-9]+\.[0-9]+" | head -1)"
            fi
            if [ -z "$MIN" ]; then
              MIN="15.0"
              echo "!! 没能从 podspec 解析出最低版本，回退到 $MIN 继续尝试"
            fi
            echo "IOS_MIN=$MIN"
            echo "IOS_MIN=$MIN" >> "$GITHUB_ENV"

            # Podfile：platform 行 + post_install 里的统一常量
            sed -i '' -E "s/^platform :ios, '[0-9.]+'/platform :ios, '$MIN'/" ios/Podfile
            sed -i '' -E "s/(\['IPHONEOS_DEPLOYMENT_TARGET'\] = ')[0-9.]+'/\1$MIN'/" ios/Podfile

            # Xcode 工程（Debug/Release/Profile 三份配置）
            sed -i '' -E "s/IPHONEOS_DEPLOYMENT_TARGET = [0-9.]+;/IPHONEOS_DEPLOYMENT_TARGET = $MIN;/g" \
              ios/Runner.xcodeproj/project.pbxproj

            # Flutter 框架最低版本
            /usr/libexec/PlistBuddy -c "Set :MinimumOSVersion $MIN" ios/Flutter/AppFrameworkInfo.plist \
              || /usr/libexec/PlistBuddy -c "Add :MinimumOSVersion string $MIN" ios/Flutter/AppFrameworkInfo.plist

            echo "--- 对齐结果 ---"
            grep -n "platform :ios" ios/Podfile
            grep -n "IPHONEOS_DEPLOYMENT_TARGET" ios/Podfile || true
            grep -o "IPHONEOS_DEPLOYMENT_TARGET = [0-9.]*" ios/Runner.xcodeproj/project.pbxproj | sort -u
            /usr/libexec/PlistBuddy -c "Print :MinimumOSVersion" ios/Flutter/AppFrameworkInfo.plist
          } 2>&1 | tee /tmp/02-align.log

      - name: Install CocoaPods
        working-directory: ios
        run: |
          set -o pipefail
          pod install 2>&1 | tee /tmp/03-pod.log | tail -40

      - name: Build (no codesign)
        run: |
          set -o pipefail
          flutter build ios --release --no-codesign 2>&1 | tee /tmp/04-build.log | tail -60

      - name: Package Payload
        run: |
          set -euo pipefail
          APP_PATH="build/ios/iphoneos/Runner.app"
          test -d "$APP_PATH" || { echo "Runner.app 不存在，构建失败"; exit 1; }
          rm -rf Payload xGiWifi-unsigned.ipa
          mkdir -p Payload
          cp -R "$APP_PATH" Payload/
          zip -qry xGiWifi-unsigned.ipa Payload
          ls -lh xGiWifi-unsigned.ipa
          echo "### 产物大小" >> "$GITHUB_STEP_SUMMARY"
          du -h xGiWifi-unsigned.ipa >> "$GITHUB_STEP_SUMMARY"

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: xgiwifi-unsigned-ipa
          path: xGiWifi-unsigned.ipa
          if-no-files-found: error
          retention-days: 14

      # 失败时把日志推到 ci-logs 分支，便于在没有登录会话的情况下读取真实报错
      - name: Publish failure logs
        if: failure()
        run: |
          set -x
          mkdir -p ci-logs
          cp /tmp/*.log ci-logs/ 2>/dev/null || true
          flutter doctor -v > ci-logs/09-doctor.log 2>&1 || true
          echo "run_id=$GITHUB_RUN_ID" > ci-logs/meta.txt
          echo "sha=$GITHUB_SHA" >> ci-logs/meta.txt
          git config user.name "ci-bot"
          git config user.email "ci-bot@users.noreply.github.com"
          git checkout -B ci-logs
          git add -A -f ci-logs
          git commit -m "ci: failure log for run $GITHUB_RUN_ID" || true
          git push -f origin ci-logs
